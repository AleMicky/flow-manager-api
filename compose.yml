name: dba-flow-manager-api

services:
  postgres:
    image: postgres:17-alpine
    container_name: dba-flow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}

    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    volumes:
      - dba-flow-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dba-flow-postgres-data:
